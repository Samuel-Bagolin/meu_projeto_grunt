<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="../dev/styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card-calculator">
            
            <form id="age-form" class="form-control">
                <div class="form-control-item">
                    <label for="day">Day</label>
                    <input id="day" type="text" placeholder="DD">
                    <small class="error-message"></small>
                </div>
                
                <div class="form-control-item">
                    <label for="month">Month</label>
                    <input id="month" type="text" placeholder="MM">
                    <small class="error-message"></small>
                </div>

                <div class="form-control-item">
                    <label for="year">Year</label>
                    <input id="year" type="text" placeholder="YYYY">
                    <small class="error-message"></small>
                </div>
            </form>

            <div class="divider-container">
                <hr class="divider-line">
                <button type="button" class="calculator-btn">
                    <img class="icon-img" src="../src/imagens/icon-arrow.svg" alt="arrow-icon">
                </button>
            </div>
        </div>

        <div class="results">
            <p><span class="result-value" id="years">--</span> years</p>
            <p><span class="result-value" id="months">--</span> months</p>
            <p><span class="result-value" id="days">--</span> days</p>
        </div>
    </div>

    <script src="./scripts/app.js"></script>
</body>
</html>
